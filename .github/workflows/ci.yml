name: ci

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  trust-boundary:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate repository branch provenance
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: test "$HEAD_REPOSITORY" = "${{ github.repository }}"

  rust:
    needs: trust-boundary
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e # 1.92.0
        with:
          toolchain: 1.92.0
          components: clippy, rustfmt
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler python3-requests python3-protobuf ripgrep
      - name: Release version consistency
        run: python3 .github/tools/check_release_version.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --locked -j 2
      - name: WAL phase crash matrix (non-production hooks)
        run: cargo test -p chirondb --features fault-injection --test process_kill --locked -j 2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -j 2 -- -D warnings
      - name: WAL phase crash matrix clippy
        run: cargo clippy -p chirondb --features fault-injection --test process_kill --locked -j 2 -- -D warnings
      - name: Build release binaries
        run: cargo build --release --locked --bins
      - name: Protected reference migration crash rehearsal
        run: |
          cargo test -p chirondb-core --lib --features fault-injection --locked -j 2 --no-run --message-format=json > "$RUNNER_TEMP/reference-fixture-build.json"
          python3 - "$RUNNER_TEMP/reference-fixture-build.json" "$RUNNER_TEMP/reference-fixture-path" <<'PY'
          import json
          import pathlib
          import sys

          artifacts = (
              json.loads(line)
              for line in pathlib.Path(sys.argv[1]).read_text().splitlines()
              if line.startswith('{')
          )
          binaries = [
              item['executable']
              for item in artifacts
              if item.get('reason') == 'compiler-artifact'
              and item['target']['name'] == 'chirondb_core'
              and item['profile']['test']
              and item.get('executable')
          ]
          if len(binaries) != 1:
              raise SystemExit(f'expected one core test executable, got {binaries}')
          pathlib.Path(sys.argv[2]).write_text(binaries[0])
          PY
          cargo build -p chirondb --bin chironctl --features fault-injection --locked -j 2
          python3 chirondb-server/tests/protected_reference_migration_cli.py \
            --fixture-test "$(cat "$RUNNER_TEMP/reference-fixture-path")" \
            --release-cli target/release/chironctl \
            --fault-cli target/debug/chironctl \
            --output "$RUNNER_TEMP/reference-migration.json"
      - name: Protected reference migration real ENOSPC
        run: |
          image="$RUNNER_TEMP/reference-enospc.img"
          mountpoint="$RUNNER_TEMP/reference-enospc"
          test ! -e "$image"
          truncate -s 64M "$image"
          mkfs.ext4 -q -F -m 0 "$image"
          mkdir -p "$mountpoint"
          sudo mount -o loop "$image" "$mountpoint"
          trap 'sudo umount "$mountpoint"' EXIT
          sudo chown "$(id -u):$(id -g)" "$mountpoint"
          touch "$mountpoint/.chirondb-enospc-test-device"
          PYTHONDONTWRITEBYTECODE=1 python3 chirondb-server/tests/protected_reference_migration_enospc.py \
            --fixture-test "$(cat "$RUNNER_TEMP/reference-fixture-path")" \
            --release-cli target/release/chironctl \
            --fault-cli target/debug/chironctl \
            --mount-root "$mountpoint" \
            --output "$RUNNER_TEMP/reference-enospc.json"
      - name: Upload protected reference migration evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protected-reference-migration-${{ github.sha }}
          path: |
            ${{ runner.temp }}/reference-migration.json
            ${{ runner.temp }}/reference-enospc.json
          if-no-files-found: error
      - name: Upload candidate binaries for external SDK qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-candidate-binaries
          path: |
            target/release/chirondb
            target/release/chironctl
            target/release/chironql
            target/release/chironmcp
          if-no-files-found: error
      - name: WAL recovery durability gate (100K × 128D)
        run: >-
          target/release/chirondrill
          --points 100000
          --vector-dim 128
          --max-recovery-seconds 30
          --max-rss-delta-mib 256
      - name: Binary version consistency
        run: bash .github/tools/check_binary_versions.sh target/release
      - name: Performance regression gate
        run: python3 .github/tools/perf_gate.py --max-search-p99-ms 50 --min-write-points-per-second 10 --min-search-queries-per-second 10
      - name: Scale footprint gate
        run: python3 .github/tools/scale_gate.py --points 1000 --dim 64 --batch-size 100 --searches 25 --k 10 --target-points 1000000000 --max-projected-gib 4096
      - name: Recall regression gate
        run: python3 .github/tools/recall_gate.py --points 200 --dim 32 --queries 20 --k 10 --min-recall 0.95

  sdk-integration:
    name: Authenticated standalone SDK integration
    needs: [trust-boundary, rust]
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - name: Install fixture dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler openssl python3-venv
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdk-candidate-binaries
          path: ${{ runner.temp }}/sdk-bins
      - name: Restore executable fixture permissions
        run: |
          chmod +x "$RUNNER_TEMP/sdk-bins"/*
          echo "CHIRONDB_BIN_DIR=$RUNNER_TEMP/sdk-bins" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned standalone SDK packages
        env:
          SDK_REPOS_READ_TOKEN: ${{ secrets.SDK_REPOS_READ_TOKEN }}
        run: |
          python3 -m venv "$RUNNER_TEMP/sdk-venv"
          "$RUNNER_TEMP/sdk-venv/bin/python" .github/tools/install_standalone_sdks.py
          echo "$RUNNER_TEMP/sdk-venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Standalone Rust, Python and Node contracts against this server
        env:
          CHIRONDB_ML_WORKER_SCRIPT: ${{ github.workspace }}/ml-worker/chirondb_ml_worker.py
        run: |
          python3 -m venv "$RUNNER_TEMP/sdk-ml"
          "$RUNNER_TEMP/sdk-ml/bin/python" -m pip install -r ml-worker/requirements-traditional.txt
          export CHIRONDB_ML_WORKER_PYTHON="$RUNNER_TEMP/sdk-ml/bin/python"
          cargo fmt --manifest-path sdk-integration/Cargo.toml -- --check
          cargo clippy --offline --locked --manifest-path sdk-integration/Cargo.toml --all-targets -- -D warnings
          cargo test --offline --locked --manifest-path sdk-integration/Cargo.toml
          (cd "$CHIRONDB_SDK_RUST_ROOT" && python3 scripts/test_fixture_startup.py)
          cargo test --offline --locked --manifest-path "$CHIRONDB_SDK_RUST_ROOT/Cargo.toml"
          (cd "$CHIRONDB_SDK_RUST_ROOT" && cargo package -p chirondb-client --offline --locked && python3 scripts/package_compat.py)
          cargo test --offline --locked --manifest-path "$CHIRONDB_SDK_RUST_ROOT/target/package/chirondb-client-0.1.0-beta.2/Cargo.toml"
          cargo run --offline --locked --manifest-path sdk-integration/Cargo.toml --example graph_vector_preview
          python3 -m pytest "$CHIRONDB_SDK_PYTHON_ROOT/tests" -q
          npm --prefix "$CHIRONDB_SDK_NODE_ROOT" ci
          npm --prefix "$CHIRONDB_SDK_NODE_ROOT" test
          npm --prefix "$CHIRONDB_SDK_NODE_ROOT" run test:integration
          (cd "$CHIRONDB_SDK_NODE_ROOT" && npm pack && node scripts/test_package.mjs)
      - name: MCP Python SDK and stdio interoperability
        run: |
          python3 -m venv "$RUNNER_TEMP/mcp-venv"
          "$RUNNER_TEMP/mcp-venv/bin/pip" install -r chirondb-server/tests/mcp_requirements.txt
          "$RUNNER_TEMP/mcp-venv/bin/pip" install "$(ls "$CHIRONDB_SDK_PYTHON_ROOT"/dist/*.whl)"
          "$RUNNER_TEMP/mcp-venv/bin/python" chirondb-server/tests/mcp_interop.py --bins "$RUNNER_TEMP/sdk-bins"
      - name: Traditional ML worker and real protocol/SDK scenarios
        run: |
          python3 -m venv "$RUNNER_TEMP/chirondb-ml-python"
          ml_python="$RUNNER_TEMP/chirondb-ml-python/bin/python"
          "$ml_python" -m pip install -r ml-worker/requirements-traditional.txt requests==2.34.2 protobuf==7.36.2
          PYTHONPATH=ml-worker "$ml_python" -m unittest -v test_worker
          "$ml_python" -m pip install "$(ls "$CHIRONDB_SDK_PYTHON_ROOT"/dist/*.whl)[async,dev]"
          "$ml_python" -m pytest "$CHIRONDB_SDK_PYTHON_ROOT/tests/test_ml_sdk.py" -q
          export CHIRONDB_ML_WORKER_PYTHON="$ml_python"
          export CHIRONDB_ML_SDK_PYTHON="$ml_python"
          export CHIRONDB_ML_WORKER_SCRIPT="$GITHUB_WORKSPACE/ml-worker/chirondb_ml_worker.py"
          cargo test --offline --manifest-path sdk-integration/Cargo.toml --test ml_materialize --locked -j 2 traditional_models_materialize_and_refresh_through_http_and_sdks -- --ignored --exact
          cargo test --offline --manifest-path sdk-integration/Cargo.toml --test ml_materialize --locked -j 2 grpc_and_chironwire_share_ml_materialization -- --ignored --exact
          CHIRONDB_ML_WORKER_SCRIPT="$GITHUB_WORKSPACE/ml-worker/delayed_worker.py" cargo test --offline --manifest-path sdk-integration/Cargo.toml --test ml_materialize --locked -j 2 job_uses_submission_snapshot_and_serializes_refreshes -- --ignored --exact

  docker:
    name: Docker deployment smoke
    needs: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build production image
        run: |
          docker build \
            --build-arg CHIRONDB_VERSION=0.1.0-beta.2 \
            --build-arg VCS_REF=${{ github.sha }} \
            -t chirondb:ci .
      - name: Three-protocol persistence smoke
        run: bash .github/tools/smoke_container.sh chirondb:ci

  required:
    name: ci-required
    if: always()
    needs: [trust-boundary, rust, docker, sdk-integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Require CI and deployment smoke
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          TRUST_RESULT: ${{ needs.trust-boundary.result }}
          SDK_RESULT: ${{ needs.sdk-integration.result }}
        run: test "$TRUST_RESULT" = success && test "$RUST_RESULT" = success && test "$DOCKER_RESULT" = success && test "$SDK_RESULT" = success
