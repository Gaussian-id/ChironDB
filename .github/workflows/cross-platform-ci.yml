name: cross-platform-ci

# OSS CI runs natively on GitHub-hosted Linux x86-64/ARM64 and macOS
# Intel/ARM64. All four are required; Windows remains best-effort.
# Runner labels: https://docs.github.com/en/actions/reference/runners/github-hosted-runners

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - feat/continue-dev-kevin

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch — the matrix takes a while
# and stale runs from force-pushes waste CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  trust-boundary:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate repository branch provenance
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: test "$HEAD_REPOSITORY" = "${{ github.repository }}"

  build:
    name: ${{ matrix.label }}
    needs: trust-boundary
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            label: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            label: linux-aarch64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            label: darwin-x86_64
          - target: aarch64-apple-darwin
            runner: macos-15
            label: darwin-aarch64
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: short
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e # 1.92.0
        with:
          toolchain: 1.92.0
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true

      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler python3-requests python3-protobuf ripgrep

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Python smoke dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/chirondb-smoke-python"
          "$RUNNER_TEMP/chirondb-smoke-python/bin/python" -m pip install requests==2.34.2 protobuf==7.36.2
          echo "$RUNNER_TEMP/chirondb-smoke-python/bin" >> "$GITHUB_PATH"

      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y protoc
          echo "C:\ProgramData\chocolatey\lib\protoc\tools\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} --locked -j 2 -- -D warnings

      - name: cargo test
        shell: bash
        run: cargo test --workspace --target ${{ matrix.target }} --locked -j 2

      - name: cargo build --release --bins
        shell: bash
        run: cargo build --release --locked --bins --target ${{ matrix.target }} -j 2

  required-platforms:
    name: required-platforms
    if: always()
    needs: [trust-boundary, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the four-platform matrix
        env:
          MATRIX_RESULT: ${{ needs.build.result }}
          TRUST_RESULT: ${{ needs.trust-boundary.result }}
        run: test "$TRUST_RESULT" = success && test "$MATRIX_RESULT" = success

  windows-best-effort:
    if: vars.CHIRONDB_ENABLE_GITHUB_HOSTED_WINDOWS == 'true'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e # 1.92.0
        with:
          toolchain: 1.92.0
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - shell: pwsh
        run: choco install -y protoc
      - run: cargo test --workspace --target x86_64-pc-windows-msvc --locked -j 2
