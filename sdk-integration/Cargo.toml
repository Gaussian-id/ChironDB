[package]
name = "chirondb-sdk-integration"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "AGPL-3.0-only"

[workspace]

[dependencies]
chirondb = { path = "../chirondb-server" }
chirondb-client = { git = "https://github.com/Gaussian-id/chirondb-rust", rev = "dbbd5924c97380265d041fbefde09ce7809ebf6c", version = "=0.1.0-beta.2" }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
chirondb-types = { path = "../chirondb-types" }
axum = "0.8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tempfile = "3"
rcgen = "0.14"

[features]
fault-injection = ["chirondb/fault-injection"]
