[package]
name = "chirondb-types"
version = "0.1.0-beta.2"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
# JSON persistence and receipts must recover the writer's finite floating bits.
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
smol_str = "0.3.6"
thiserror = "2.0.18"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
# M3-004: portable SIMD (AVX2/AVX-512/NEON) for distance kernels.
wide = "0.7"
