[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # RUSTSEC-2026-0542 (humantime) and RUSTSEC-2026-0543 (chrono) are
  # informational "unmaintained" notices, not vulnerabilities, and no patched
  # release exists. Both arrive transitively (object_store pulls humantime and
  # chrono; rmcp and schemars pull chrono), so no version bump removes them.
  # Authorized by Kevin on 2026-11-20, reversing the earlier strict-gate hold
  # on OSS PR #11. Only these two IDs; keep in sync with .cargo/audit.toml.
  # TIME-BOXED: revisit when object_store/rmcp drop chrono/humantime or a
  # maintained successor lands.
  "RUSTSEC-2026-0542",
  "RUSTSEC-2026-0543",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDDL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
